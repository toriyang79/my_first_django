<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>깨어나는 거인 — The Waking Giant</title>
<style>
  :root{--bg:#000;--ink:#f3e6c8}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif KR",serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#000}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);background:rgba(0,0,0,.55);cursor:pointer;transition:opacity .8s;text-align:center;padding:0 16px}
  #ov h1{font-weight:400;letter-spacing:.35em;font-size:clamp(20px,3.4vw,40px);margin:0 0 .4em}
  #ov p{opacity:.75;letter-spacing:.12em;font-size:clamp(12px,1.5vw,16px);margin:.2em}
  #ov .btn{margin-top:1.4em;border:1px solid rgba(243,230,200,.6);padding:.6em 1.6em;letter-spacing:.3em;border-radius:2px}
  #ov.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="ov"><h1>깨어나는 거인</h1><p>THE WAKING GIANT</p><p id="msg">배경을 그리는 중…</p><div class="btn" id="btn" style="visibility:hidden">▶ 재생 · 소리 켜짐</div></div>
<script>
'use strict';
/* =====================================================================
   The Waking Giant — hand-drawn style 2D animation, single file.
   Everything is painted procedurally at load: gouache backgrounds are
   built from thousands of brush dabs; the robot is a cel layer with
   variable-pressure ink, hard-edged shadows and painted weathering.
   Character animation runs on twos (12 drawings/sec), camera on ones.
   ===================================================================== */
const W=1280,H=720,DUR=48;
const cv=document.getElementById('c'),X=cv.getContext('2d');

/* ---------------- utilities ---------------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const n2=v=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
function vnoise(seed){const R=mulberry(seed),T=new Float32Array(1024);for(let i=0;i<1024;i++)T[i]=R();return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return T[i&1023]*(1-u)+T[(i+1)&1023]*u}}
function fbm(n,x,o=4){let s=0,a=.5,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f+i*31.7);t+=a;a*=.5;f*=2.07}return s/t}
function jit(R,c,a){const d=(R()-.5)*a;return[c[0]+d+(R()-.5)*a*.6,c[1]+d+(R()-.5)*a*.6,c[2]+d+(R()-.5)*a*.6]}
function sampleStops(st,k){if(k<=st[0][0])return st[0][1];for(let i=1;i<st.length;i++){if(k<=st[i][0]){const a=st[i-1],b=st[i];return mix(a[1],b[1],(k-a[0])/((b[0]-a[0])||1))}}return st[st.length-1][1]}

/* =====================================================================
   GOUACHE PAINTER  (backgrounds)
   ===================================================================== */
function mk(w,h,seed){const c=document.createElement('canvas');c.width=w;c.height=h;return{c,g:c.getContext('2d'),R:mulberry(seed),w,h}}
function dab(p,x,y,r,col,a,el,ang){
  el=el||1;ang=ang||0;const g=p.g,R=p.R,n=6+(R()*4|0),ca=Math.cos(ang),sa=Math.sin(ang),P=[];
  for(let i=0;i<n;i++){const th=i/n*6.2832+(R()-.5)*.55,rr=r*(.7+R()*.42),lx=Math.cos(th)*rr*el,ly=Math.sin(th)*rr;P.push([x+lx*ca-ly*sa,y+lx*sa+ly*ca])}
  g.fillStyle=css(col,a);g.beginPath();g.moveTo((P[n-1][0]+P[0][0])/2,(P[n-1][1]+P[0][1])/2);
  for(let i=0;i<n;i++){const A=P[i],B=P[(i+1)%n];g.quadraticCurveTo(A[0],A[1],(A[0]+B[0])/2,(A[1]+B[1])/2)}g.fill();
}
/* a mass painted in tones, lit from direction L (unit, pointing toward light) */
function sblob(p,cx,cy,rx,ry,L,tones,th,dr,o={}){
  const R=p.R,dens=o.dens||1,a=o.a||.93,n=Math.max(8,(Math.PI*rx*ry)/(dr*dr)*1.05*dens|0);
  for(let k=0;k<tones.length;k++){
    const cnt=k?n*.75:n;
    for(let i=0;i<cnt;i++){
      const an=R()*6.2832,d=Math.sqrt(R()),ux=Math.cos(an)*d,uy=Math.sin(an)*d;
      if(k){const v=ux*L[0]+uy*L[1]+(R()-.5)*(o.nz||.45);if(v<th[k-1])continue}
      const rr=dr*(.5+R()*.75)*(k?1-.18*k:1);
      dab(p,cx+ux*rx,cy+uy*ry,rr,jit(R,tones[k],o.j||10),a,o.el||1.2,R()*6.28);
    }
  }
}
function paintSky(p,st,y0=0,y1){
  const g=p.g,R=p.R;y1=y1||p.h;
  for(let y=y0;y<y1;y+=2){g.fillStyle=css(sampleStops(st,(y-y0)/(y1-y0)));g.fillRect(0,y,p.w,2)}
  const n=p.w*(y1-y0)/260;
  for(let i=0;i<n;i++){const x=R()*p.w,y=y0+R()*(y1-y0),c=jit(R,sampleStops(st,clamp((y-y0)/(y1-y0)+(R()-.5)*.025)),9);dab(p,x,y,5+R()*10,c,.2+R()*.18,3+R()*5,(R()-.5)*.08)}
}
/* cumulus lit from a low sun: crisp painted silhouette, toned inside. tones=[shade,mid,lit,rim] */
function cloud(p,x,y,w,h,tones,L){
  const R=p.R,tw=Math.ceil(w*1.5),th=Math.ceil(h*3.4),t=mk(tw,th,(R()*1e6)|0),ox=tw/2,oy=th*.78;
  const n=Math.max(4,w/(h*.65)|0),puffs=[];
  for(let i=0;i<n;i++){const u=n>1?i/(n-1):.5,b=Math.sin(u*Math.PI)*.85+.15,pr=h*(.4+.6*b)*(.75+R()*.4);puffs.push([ox+(u-.5)*w*.9+(R()-.5)*h*.3,oy-pr*.35,pr])}
  for(let i=0;i<n*.7;i++){const q=puffs[(R()*n)|0];const r2=q[2]*(.45+R()*.35);puffs.push([q[0]+(R()-.5)*q[2]*.9,q[1]-q[2]*(.35+R()*.45),r2])}
  puffs.sort((a,b)=>a[1]-b[1]);
  for(const q of puffs)dab(t,q[0],q[1],q[2],tones[1],1,1.08,R());
  t.g.globalCompositeOperation='destination-out';t.g.fillStyle='#000';t.g.beginPath();t.g.moveTo(0,oy+h*.08);for(let xx=0;xx<=tw;xx+=12)t.g.lineTo(xx,oy+h*.05+Math.sin(xx*.05)*h*.05);t.g.lineTo(tw,th);t.g.lineTo(0,th);t.g.fill();
  t.g.globalCompositeOperation='source-atop';
  for(const q of puffs){const[cx,cy,r]=q;
    for(let i=0;i<r*r/28;i++){const an=R()*6.283,d=Math.sqrt(R()),ux=Math.cos(an)*d,uy=Math.sin(an)*d,v=ux*L[0]+uy*L[1]+(R()-.5)*.35;
      let c=null,a=.55;if(v<-.25){c=tones[0];a=.5}else if(v>.62){c=tones[3];a=.75}else if(v>.2){c=tones[2];a=.6}
      if(c)dab(t,cx+ux*r,cy+uy*r,r*(.12+R()*.16),jit(R,c,6),a,1.4,R()*3)}}
  for(let i=0;i<w/7;i++)dab(t,ox+(R()-.5)*w*.9,oy+h*.02-R()*h*.14,h*.06+R()*h*.05,jit(R,tones[2],6),.35,3,0);
  p.g.drawImage(t.c,x-ox,y-oy);
}
function stratus(p,x,y,w,h,col,col2){const R=p.R;for(let i=0;i<w/4;i++){const u=R()-.5,k=1-Math.abs(u)*1.8;dab(p,x+u*w,y+(R()-.5)*h*k,h*(.4+R()*.5)*k+1,jit(R,R()<.6?col:col2,8),.16,6+R()*6,(R()-.5)*.04)}}
function ridge(p,y0,amp,sc,col,top,seed,bump){
  const n=vnoise(seed),g=p.g,R=p.R,pts=[];
  for(let x=-20;x<=p.w+20;x+=3){let y=y0-amp*(fbm(n,x/sc)-.3);if(bump)y-=bump*(.5+.5*Math.sin(x/(bump*.9)+n(x/40)*6));pts.push([x,y])}
  g.fillStyle=css(col);g.beginPath();g.moveTo(-20,p.h);pts.forEach(q=>g.lineTo(q[0],q[1]));g.lineTo(p.w+20,p.h);g.fill();
  for(const q of pts){if(R()<.7)dab(p,q[0],q[1]+2+R()*5,2+R()*4,jit(R,top,8),.55,1.5,0)}
  for(let i=0;i<p.w*1.4;i++){const q=pts[R()*pts.length|0];dab(p,q[0],q[1]+8+R()*90,3+R()*7,jit(R,mix(col,top,R()*.3),9),.22,2.6,0)}
  return pts;
}
function mistBand(p,y,h,col,a,w0,w1){const R=p.R;w0=w0||0;w1=w1||p.w;for(let i=0;i<(w1-w0)*h/120;i++){dab(p,w0+R()*(w1-w0),y+(R()-.5)*h,h*(.25+R()*.4),jit(R,col,6),a*(.4+R()*.6)*.4,5+R()*6,(R()-.5)*.04)}}
function trunkPaint(p,x,y0,y1,w,tones,mossC){
  const R=p.R,g=p.g,h=y0-y1,bend=(R()-.5)*w*2.2,L=[],Rt=[];
  for(let i=0;i<=12;i++){const t=i/12,cx=x+Math.sin(t*2.6)*bend*t,ww=w*(1+(1-t)**3*1.1)*(1-.3*t);L.push([cx-ww,y0-h*t]);Rt.push([cx+ww,y0-h*t])}
  g.fillStyle=css(tones[0]);g.beginPath();L.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));for(let i=Rt.length-1;i>=0;i--)g.lineTo(Rt[i][0],Rt[i][1]);g.fill();
  const n=h*w/14;
  for(let i=0;i<n;i++){const t=R(),k=Math.floor(t*12),a=L[k],b=Rt[k],u=R();if(u>.62)continue;const xx=lerp(a[0],b[0],u),yy=a[1]-R()*h/12;dab(p,xx,yy,w*.09+R()*w*.06,jit(R,u<.28?tones[2]:tones[1],10),.75,.35,0)}
  if(mossC)for(let i=0;i<n*.25;i++){const t=R()*.7,k=Math.floor(t*12),a=L[k],b=Rt[k],u=R()*.5;dab(p,lerp(a[0],b[0],u),a[1]-R()*h/12,w*.12+R()*w*.1,jit(R,mossC,12),.8,.7,0)}
  return{L,Rt};
}
function crown(p,cx,cy,cw,pal,L,o={}){
  const R=p.R,N=o.N||(6+R()*5|0),cl=[];
  for(let i=0;i<N;i++){const an=R()*6.28,d=Math.sqrt(R());cl.push([cx+Math.cos(an)*d*cw*.66,cy+Math.sin(an)*d*cw*.48,cw*(.3+R()*.24)])}
  cl.push([cx+(R()-.5)*cw*.2,cy-cw*.32,cw*.38]);
  cl.sort((a,b)=>a[1]-b[1]);
  for(const c of cl)sblob(p,c[0],c[1],c[2],c[2]*.8,L,pal,o.th||[-.12,.32,.7],o.leaf||Math.max(1.6,cw*.075),{dens:o.dens||1,j:o.j||10});
}
function tree(p,x,y,h,cw,pal,tpal,L,o={}){
  const ty=y-h+cw*.7;
  trunkPaint(p,x,y,ty+cw*.2,cw*(o.tw||.1),tpal,o.moss);
  if(o.branches){const R=p.R;for(let i=0;i<3;i++){const by=lerp(y,ty,.55+R()*.3),s=R()<.5?-1:1;p.g.strokeStyle=css(tpal[0]);p.g.lineWidth=cw*.04;p.g.beginPath();p.g.moveTo(x,by);p.g.quadraticCurveTo(x+s*cw*.3,by-cw*.1,x+s*cw*.6,by-cw*.35);p.g.stroke()}}
  crown(p,x,ty,cw,pal,L,o);
}
function treeRow(p,y,x0,x1,size,pal,L,o={}){
  const R=p.R;
  p.g.fillStyle=css(pal[0]);p.g.fillRect(x0,y,x1-x0,size*(o.fill||3));
  for(let x=x0;x<x1;x+=size*(.75+R()*.5)){const s=size*(.7+R()*.7);crown(p,x,y-s*(o.lift||.25)-R()*size*.4,s,pal,L,{N:3+(R()*3|0),leaf:Math.max(1.4,s*.12),dens:o.dens||.8,j:o.j||8})}
}
function forestWall(p,yb,ht,x0,x1,pal,tpal,L,o={}){
  const R=p.R,g=p.g,dk=mix(pal[0],[8,10,16],.25);
  g.fillStyle=css(dk);g.beginPath();g.moveTo(x0,yb+10);for(let x=x0;x<=x1;x+=20)g.lineTo(x,yb-ht*.55-R()*ht*.1);g.lineTo(x1,yb+10);g.fill();
  const gi=g.createLinearGradient(0,yb-ht*.6,0,yb);gi.addColorStop(0,css(dk));gi.addColorStop(1,css(mix(dk,pal[1],.35)));g.fillStyle=gi;g.fillRect(x0,yb-ht*.6,x1-x0,ht*.6+10);
  for(let i=0;i<(x1-x0)/(ht*.28);i++){const x=x0+R()*(x1-x0),w=ht*(.015+R()*.03),dd=R();trunkPaint(p,x,yb+4,yb-ht*(.5+R()*.2),w,tpal.map(c=>mix(c,mix(dk,pal[1],.4),.45+dd*.4)))}
  for(let i=0;i<(x1-x0)/30;i++)dab(p,x0+R()*(x1-x0),yb-R()*ht*.4,ht*.04+R()*ht*.04,jit(R,mix(dk,pal[1],.3),8),.5,.4,0);
  const cs=[];for(let x=x0-ht*.2;x<x1+ht*.2;x+=ht*(.22+R()*.18))cs.push([x,yb-ht*(.62+R()*.28),ht*(.26+R()*.16)]);for(let x=x0;x<x1;x+=ht*(.3+R()*.3))if(R()<.55)cs.push([x,yb-ht*(.32+R()*.15),ht*(.16+R()*.1)]);
  cs.sort((a,b)=>a[1]-b[1]);
  for(const c of cs)crown(p,c[0],c[1],c[2],pal,L,{N:5+(R()*4|0),leaf:Math.max(1.5,c[2]*(o.leafK||.07)),dens:o.dens||.85});
  for(let x=x0;x<x1;x+=ht*.12)sblob(p,x+R()*ht*.1,yb-ht*.04,ht*(.08+R()*.07),ht*.06,L,pal.map(c=>mix(c,dk,.2)),[-.1,.4,.75],Math.max(1.5,ht*.016),{dens:.9});
}
function meadow(p,y0,y1,far,near,lit,L){
  const g=p.g,R=p.R;
  for(let y=y0;y<y1;y+=2){const k=(y-y0)/(y1-y0);g.fillStyle=css(mix(far,near,k*k));g.fillRect(0,y,p.w,2)}
  for(let i=0;i<p.w*(y1-y0)/40;i++){const y=y0+R()*(y1-y0),k=(y-y0)/(y1-y0),c=mix(far,near,k*k);dab(p,R()*p.w,y,2+k*7+R()*3,jit(R,R()<.18?mix(c,lit,.5):c,14),.5,3.2,(R()-.5)*.1)}
}
function grassTufts(p,y0,y1,n,cols,hgt,o={}){
  const g=p.g,R=p.R;
  for(let i=0;i<n;i++){const y=y0+Math.pow(R(),o.pow||.6)*(y1-y0),k=(y-y0)/(y1-y0),x=R()*p.w,hh=hgt*(.3+k)*(.6+R()*.6),c=cols[R()*cols.length|0];
    const bl=4+(R()*6|0);for(let j=0;j<bl;j++){const lean=(R()-.5)*hh*.7+(o.lean||0)*hh,bx=x+(R()-.5)*hh*.3;g.strokeStyle=css(jit(R,c,14),.9);g.lineWidth=Math.max(.8,hh*.06*(.6+R()*.6));g.beginPath();g.moveTo(bx,y);g.quadraticCurveTo(bx+lean*.3,y-hh*.6,bx+lean,y-hh*(.8+R()*.3));g.stroke()}}
}
function flowersP(p,y0,y1,n,cols,sz){const R=p.R;for(let i=0;i<n;i++){const y=y0+R()*(y1-y0),k=(y-y0)/(y1-y0),x=R()*p.w,c=cols[R()*cols.length|0],r=sz*(.4+k)*(.6+R()*.5);const cl=1+(R()*4|0);for(let j=0;j<cl;j++)dab(p,x+(R()-.5)*r*6,y+(R()-.5)*r*2,r,jit(R,c,10),.95,1.1,0)}}
function shafts(p,x,y,ang,spread,len,col,a,n){const g=p.g,R=p.R;g.save();g.globalCompositeOperation='screen';for(let i=0;i<n;i++){const an=ang+(R()-.5)*spread,w=.01+R()*.03,gr=g.createLinearGradient(x,y,x+Math.cos(an)*len,y+Math.sin(an)*len);gr.addColorStop(0,css(col,a*(.4+R()*.6)));gr.addColorStop(1,css(col,0));g.fillStyle=gr;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an-w)*len,y+Math.sin(an-w)*len);g.lineTo(x+Math.cos(an+w)*len,y+Math.sin(an+w)*len);g.fill()}g.restore()}

/* =====================================================================
   PALETTES
   ===================================================================== */
const LBG=n2([-.85,-.55]);
const P_DAWN=['#1b3236','#2c4a46','#4f6d52','#c9a27c'].map(hx);
const P_DAY=['#1e3b37','#355e45','#6f9150','#ecd28c'].map(hx);
const T_DAWN=['#262531','#46424a','#7a6a66'].map(hx);
const T_DAY=['#2c2622','#4f4136','#9a7d5e'].map(hx);
const palFog=(pal,f,k)=>pal.map(c=>mix(c,f,k));

/* =====================================================================
   BACKGROUND BUILDS (one per cut, multiplane layers)
   ===================================================================== */
const BG={};
const steps=[];
/* ---- A : establishing wide (dawn) ---- also used for G (ignition wide) */
steps.push(()=>{
  const sky=mk(1500,860,101),L=n2([-.9,.25]);
  paintSky(sky,[[0,'#232c4c'],[.25,'#434d7a'],[.44,'#857a9e'],[.56,'#cf9894'],[.64,'#eebd96'],[.72,'#f7d6a8'],[1,'#f6dfb6']].map(s=>[s[0],hx(s[1])]));
  const ct=['#6a6488','#9784a2','#e9a88e','#ffd9ac'].map(hx);
  cloud(sky,1080,250,420,60,ct,L);cloud(sky,560,170,280,42,ct,L);cloud(sky,1380,330,220,34,ct,L);
  for(let i=0;i<8;i++)stratus(sky,150+i*180+sky.R()*80,400+sky.R()*110,260+sky.R()*220,12+sky.R()*8,hx('#f3b996'),hx('#d99a9a'));
  const far=mk(1500,860,102);
  ridge(far,500,90,420,hx('#8f88a8'),hx('#c8a8b0'),7,0);
  mistBand(far,520,50,hx('#efc9b4'),.8);
  ridge(far,545,40,230,hx('#6e7290'),hx('#a69aae'),9,4);
  mistBand(far,560,40,hx('#e2c2b6'),.9);
  const mid=mk(1500,860,103),fog=hx('#a7a2b8');
  forestWall(mid,600,110,-40,1540,palFog(P_DAWN,fog,.55),palFog(T_DAWN,fog,.5),LBG,{dens:.7});
  mistBand(mid,590,40,hx('#d8c0bc'),.8);
  forestWall(mid,680,230,-40,1540,palFog(P_DAWN,fog,.3),palFog(T_DAWN,fog,.3),LBG,{dens:.8});
  meadow(mid,672,860,hx('#596660'),hx('#2c4234'),hx('#c7a273'),LBG);
  mistBand(mid,680,24,hx('#c9b8b4'),.7);
  // great old trees closing the clearing at both sides
  for(const t of[[120,760,520,150],[330,712,340,96],[1210,716,360,104],[1400,770,540,160]])tree(mid,t[0],t[1],t[2],t[3],palFog(P_DAWN,fog,.14),palFog(T_DAWN,fog,.12),LBG,{N:10,moss:hx('#3f5a3e'),tw:.12,branches:1});

  const verb=AC.createConvolver();{const len=sr*3.2,b=AC.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}verb.buffer=b}

  const out=(node,g=1,rv=.3)=>{const gg=AC.createGain();gg.gain.value=g;node.connect(gg);gg.connect(master);if(rv){const s=AC.createGain();s.gain.value=rv;node.connect(s);s.connect(verb)}};
  const noise=(buf,t,dur,filt,f0,f1,q,gain,atk=.05,rel=.3,rv=.2)=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const f=AC.createBiquadFilter();f.type=filt;f.frequency.setValueAtTime(f0,T0+t);f.frequency.exponentialRampToValueAtTime(f1,T0+t+dur);f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(0,T0+t);g.gain.linearRampToValueAtTime(gain,T0+t+atk);g.gain.setValueAtTime(gain,T0+t+Math.max(atk,dur-rel));g.gain.linearRampToValueAtTime(0,T0+t+dur);s.connect(f);f.connect(g);out(g,1,rv);s.start(T0+t,Math.random());s.stop(T0+t+dur+.1)};
  const tone=(type,t,dur,f0,f1,gain,atk=.01,rv=.3,filt)=>{const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,T0+t);o.frequency.exponentialRampToValueAtTime(f1,T0+t+dur);const g=AC.createGain();g.gain.setValueAtTime(0,T0+t);g.gain.linearRampToValueAtTime(gain,T0+t+atk);g.gain.exponentialRampToValueAtTime(.0001,T0+t+dur);let n=o;if(filt){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f}n.connect(g);out(g,1,rv);o.start(T0+t);o.stop(T0+t+dur+.05)};
  // ambience
  noise(bb,0,DUR,'lowpass',500,700,.5,.22,3,3,.1);

  // birdsong
  [[1.2,3200],[1.45,3900],[2.9,2800],[3.1,3400],[3.35,4200],[5.0,3000],[5.3,3600],[6.1,4400],[8.2,3300],[8.5,4000],[12.95,3800],[13.3,4300]].forEach(([t,f])=>{tone('sine',t,.12,f,f*1.35,.07,.005,.5);tone('sine',t+.13,.09,f*1.2,f*.9,.05,.005,.5)});
  for(let i=0;i<5;i++)noise(wb,11.3+i*.08,.06,'bandpass',2200,1800,2,.12,.01,.04,.1);
  // music: warm pad (score)
  const nf=n=>440*Math.pow(2,(n-69)/12);
  const pad=(t,dur,notes,g)=>notes.forEach(n=>{for(const det of[-6,5]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=nf(n);o.detune.value=det;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.Q.value=.3;const gg=AC.createGain();gg.gain.setValueAtTime(0,T0+t);gg.gain.linearRampToValueAtTime(g,T0+t+Math.min(2.5,dur*.4));gg.gain.setValueAtTime(g,T0+t+dur-1.5);gg.gain.linearRampToValueAtTime(0,T0+t+dur+.8);o.connect(f);f.connect(gg);out(gg,1,.7);o.start(T0+t);o.stop(T0+t+dur+1)}});
  pad(0,7.4,[50,57,64,66],.014);pad(7.2,7.2,[47,54,57,62],.014);pad(14.2,5.8,[43,50,54,59],.016);pad(19.8,3.8,[45,52,57,62],.018);
  pad(23.4,7.9,[47,54,59,62],.02);pad(31.2,3.7,[43,50,59,62],.022);pad(34.8,3.5,[45,52,57,61,64],.024);pad(38.2,5,[50,57,62,66,69,74],.03);pad(43,5,[47,54,62,66,71],.026);
  const pn=(t,n,g=.09)=>{tone('triangle',t,2.6,nf(n),nf(n)*.998,g,.004,.6,2600);tone('sine',t,1.8,nf(n+12),nf(n+12),g*.25,.004,.6)};
  [[1.6,78],[2.4,76],[3.2,74],[4.4,69],[5.6,71],[6.2,74],[6.8,76]].forEach(([t,n])=>pn(t,n,.07));
  [[38.6,78],[39.3,81],[40.0,83],[40.9,85],[42.2,86],[43.6,83],[44.4,81],[45.2,78]].forEach(([t,n])=>pn(t,n,.09));
  // core hum & eye
  [[15.0,.04],[15.33,.08]].forEach(([t,d])=>tone('sine',t,d+.08,62,62,.25,.005,.2));
  {const o=AC.createOscillator();o.type='sine';o.frequency.value=62;const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=124;const g=AC.createGain();g.gain.setValueAtTime(0,T0);g.gain.setValueAtTime(0,T0+15.6);g.gain.linearRampToValueAtTime(.12,T0+16.4);g.gain.setValueAtTime(.12,T0+24);g.gain.linearRampToValueAtTime(.2,T0+31);g.gain.linearRampToValueAtTime(0,T0+38.5);o.connect(g);o2.connect(g);out(g,1,.2);o.start(T0);o2.start(T0);o.stop(T0+40);o2.stop(T0+40)}
  tone('sine',18.0,2.5,880,890,.06,.3,.8);tone('sine',18.55,2.2,1318,1320,.04,.2,.8);

/* =====================================================================
   BOOT & LOOP
   ===================================================================== */
let playing=false,startMs=0,curT=0,lastF=-1,ready=false;
const ov=document.getElementById('ov'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
window.__times=[];
function build(i){if(i<steps.length){msg.textContent=`배경을 그리는 중… ${Math.round(i/steps.length*100)}%`;setTimeout(()=>{const s0=performance.now();steps[i]();window.__times.push(Math.round(performance.now()-s0));for(const k in BG){const b=BG[k];if(b&&typeof b==='object'&&!(b instanceof HTMLCanvasElement))for(const n in b)if(b[n]&&b[n].c)b[n]=b[n].c}build(i+1)},16);return}
  ready=true;msg.textContent='약 48초 · 클릭하여 재생';btn.style.visibility='visible';render(8.6);window.__ready=true}
function play(){if(!ready)return;ov.classList.add('hide');if(AC){try{AC.close()}catch(e){}AC=null}startAudio();playing=true;startMs=performance.now();lastF=-1}
ov.addEventListener('click',play);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play()}});
function loop(now){if(playing){curT=(now-startMs)/1000;if(curT>=DUR){curT=DUR;playing=false;msg.textContent='다시 보기';ov.classList.remove('hide')}}
  const f=Math.floor(curT*24);if(playing&&f!==lastF){lastF=f;render(f/24)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__render=t=>render(t);
build(0);
</script>
